server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con el nombre en una variable, nginx busca la IP del
    # backend en cada pedido y no una sola vez al arrancar: si el contenedor del
    # backend se recrea en un deploy y cambia de IP, nginx lo sigue encontrando.
    resolver 127.0.0.11 valid=10s;

    # El front llama a /api/ventas; el backend espera /ventas. Se saca el prefijo
    # /api y se reenvia al servicio "backend" del compose (puerto 3001).
    location /api/ {
        set $backend http://backend:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La app usa BrowserRouter: rutas como /ventas no existen como archivo.
    # Si no hay archivo, se devuelve index.html y React Router resuelve la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite les pone un hash al nombre (index-a1b2c3.js): si cambian, cambia el nombre,
    # asi que el navegador los puede cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
